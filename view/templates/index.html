<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Share Market Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a3e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #00d4ff;
            letter-spacing: 2px;
        }
        .header .status {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #888;
        }
        .status span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .main-container {
            padding: 16px;
        }

        /* 指数单行展示 */
        .indices-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #333 #0a0a0f;
        }
        .indices-row::-webkit-scrollbar {
            height: 4px;
        }
        .indices-row::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        .indices-row::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        .index-card {
            flex: 0 0 auto;
            min-width: 140px;
            background: linear-gradient(145deg, #14141f 0%, #0f0f1a 100%);
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .index-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }
        .index-card .name {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .index-card .price {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        .index-card .change {
            font-size: 12px;
            font-family: 'Courier New', monospace;
            margin-top: 4px;
        }
        .index-card .change.up { color: #ff4d4d; }
        .index-card .change.down { color: #2ecc71; }
        .index-card .change.flat { color: #888; }

        /* 市场广度和情绪一行 */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .metric-card {
            background: linear-gradient(145deg, #14141f 0%, #0f0f1a 100%);
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 16px;
        }
        .metric-card .title {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .breadth-numbers {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .breadth-num {
            padding: 8px;
        }
        .breadth-num .value {
            font-size: 24px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .breadth-num .label {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }
        .breadth-num.up .value { color: #ff4d4d; }
        .breadth-num.down .value { color: #2ecc71; }
        .breadth-num.ratio .value { color: #00d4ff; }

        /* 情绪仪表 */
        .sentiment-gauge {
            position: relative;
            height: 60px;
            background: linear-gradient(90deg, #2ecc71 0%, #888 50%, #ff4d4d 100%);
            border-radius: 4px;
            margin-top: 8px;
        }
        .sentiment-needle {
            position: absolute;
            top: -5px;
            width: 4px;
            height: 70px;
            background: #fff;
            border-radius: 2px;
            transition: left 0.5s ease;
            left: 50%;
        }
        .sentiment-label {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
        }

        /* 行业云图 */
        .sector-cloud-section {
            margin-top: 16px;
        }
        .sector-cloud-section .title {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .sector-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: linear-gradient(145deg, #14141f 0%, #0f0f1a 100%);
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 16px;
        }
        .sector-tag {
            padding: 8px 16px;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .sector-tag:hover {
            transform: scale(1.1);
            z-index: 10;
        }
        .sector-tag.up {
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }
        .sector-tag.down {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        .sector-tag.flat {
            background: rgba(136, 136, 136, 0.2);
            border: 1px solid #666;
            color: #888;
        }
        .sector-tag .tag-name {
            font-size: 12px;
            font-weight: 600;
        }
        .sector-tag .tag-pct {
            font-size: 10px;
            margin-top: 2px;
        }
        .sector-tag .tag-tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 12px;
            white-space: nowrap;
            z-index: 100;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .sector-tag:hover .tag-tooltip {
            display: block;
        }

        /* 强度指示器 */
        .intensity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .intensity-badge.bull { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
        .intensity-badge.bear { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .intensity-badge.neutral { background: rgba(136, 136, 136, 0.2); color: #888; }
        .intensity-badge.extreme_bull { background: #ff4d4d; color: #fff; }
        .intensity-badge.extreme_bear { background: #2ecc71; color: #fff; }

        /* 加载动画 */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid #1a1a2e;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-status {
            margin-top: 30px;
            text-align: center;
        }
        .loader-status h2 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 20px;
        }
        .loader-progress {
            width: 300px;
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .loader-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.3s ease;
        }
        .loader-info {
            text-align: left;
            font-size: 12px;
        }
        .loader-info .step {
            margin: 8px 0;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .loader-info .step.active {
            color: #00d4ff;
        }
        .loader-info .step.done {
            color: #00ff88;
        }
        .loader-info .step-icon {
            width: 16px;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .indices-row {
                gap: 8px;
            }
            .index-card {
                min-width: 120px;
                padding: 10px 12px;
            }
            .index-card .price {
                font-size: 16px;
            }
            .metrics-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-status">
            <h2>正在加载市场数据...</h2>
            <div class="loader-progress">
                <div class="loader-progress-bar" id="loader-bar" style="width: 0%;"></div>
            </div>
            <div class="loader-info">
                <div class="step" id="step-init">
                    <span class="step-icon">○</span>
                    <span>初始化连接</span>
                </div>
                <div class="step" id="step-indices">
                    <span class="step-icon">○</span>
                    <span>获取指数数据...</span>
                </div>
                <div class="step" id="step-sectors">
                    <span class="step-icon">○</span>
                    <span>加载行业板块数据...</span>
                </div>
                <div class="step" id="step-breadth">
                    <span class="step-icon">○</span>
                    <span>计算市场广度（全量A股，约60秒）...</span>
                </div>
                <div class="step" id="step-done">
                    <span class="step-icon">○</span>
                    <span>数据加载完成</span>
                </div>
            </div>
            <div style="margin-top: 20px; font-size: 11px; color: #666;">
                预计剩余时间: <span id="eta">--</span>
            </div>
        </div>
    </div>

    <div class="header">
        <h1>A-SHARE MARKET DASHBOARD</h1>
        <div class="status">
            <span><span class="dot"></span> LIVE</span>
            <span id="update-time">--:--:--</span>
        </div>
    </div>

    <div class="main-container">
        <!-- 指数单行展示 -->
        <div class="indices-row" id="indices-container">
            <div class="index-card" id="idx-sh">
                <div class="name">上证指数</div>
                <div class="price" id="sh-price">--</div>
                <div class="change" id="sh-change">--</div>
            </div>
            <div class="index-card" id="idx-sz">
                <div class="name">深证成指</div>
                <div class="price" id="sz-price">--</div>
                <div class="change" id="sz-change">--</div>
            </div>
            <div class="index-card" id="idx-cy">
                <div class="name">创业板指</div>
                <div class="price" id="cy-price">--</div>
                <div class="change" id="cy-change">--</div>
            </div>
            <div class="index-card" id="idx-star">
                <div class="name">科创50</div>
                <div class="price" id="star-price">--</div>
                <div class="change" id="star-change">--</div>
            </div>
            <div class="index-card" id="idx-star-com">
                <div class="name">科创综指</div>
                <div class="price" id="star-com-price">--</div>
                <div class="change" id="star-com-change">--</div>
            </div>
            <div class="index-card" id="idx-csi">
                <div class="name">中证全指</div>
                <div class="price" id="csi-price">--</div>
                <div class="change" id="csi-change">--</div>
            </div>
        </div>

        <!-- 市场广度和情绪一行 -->
        <div class="metrics-row">
            <div class="metric-card">
                <div class="title">市场广度</div>
                <div class="breadth-numbers">
                    <div class="breadth-num up">
                        <div class="value" id="breadth-up">--</div>
                        <div class="label">上涨</div>
                    </div>
                    <div class="breadth-num down">
                        <div class="value" id="breadth-down">--</div>
                        <div class="label">下跌</div>
                    </div>
                    <div class="breadth-num ratio">
                        <div class="value" id="breadth-ratio">--</div>
                        <div class="label">差值%</div>
                    </div>
                </div>
                <div id="breadth-label" class="intensity-badge neutral" style="margin-top:12px;display:block;text-align:center;">--</div>
            </div>

            <div class="metric-card">
                <div class="title">市场情绪</div>
                <div class="sentiment-gauge">
                    <div class="sentiment-needle" id="sentiment-needle" style="left: 50%;"></div>
                </div>
                <div class="sentiment-label" id="sentiment-label">--</div>
            </div>

            <div class="metric-card">
                <div class="title">综合信号</div>
                <div id="intensity-overall" class="intensity-badge neutral" style="font-size:14px;padding:8px 20px;display:block;text-align:center;margin-top:8px;">--</div>
                <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:10px;color:#666;">
                    <span>广度信号: <span id="intensity-breadth" class="intensity-badge neutral" style="padding:2px 8px;">--</span></span>
                    <span>板块信号: <span id="intensity-sector" class="intensity-badge neutral" style="padding:2px 8px;">--</span></span>
                </div>
            </div>
        </div>

        <!-- 行业云图 -->
        <div class="sector-cloud-section">
            <div class="title">行业板块云图（面积代表市值）</div>
            <div class="sector-cloud" id="sector-cloud">
                <div style="color:#666;font-size:12px;">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const loaderSteps = {
            init: { el: 'step-init', progress: 10 },
            indices: { el: 'step-indices', progress: 30 },
            sectors: { el: 'step-sectors', progress: 60 },
            breadth: { el: 'step-breadth', progress: 95 },
            done: { el: 'step-done', progress: 100 }
        };

        let loadStartTime = null;

        function updateLoaderStep(stepName) {
            const step = loaderSteps[stepName];
            if (!step) return;

            document.getElementById('loader-bar').style.width = step.progress + '%';

            Object.keys(loaderSteps).forEach(key => {
                const el = document.getElementById(loaderSteps[key].el);
                const icon = el.querySelector('.step-icon');
                if (key === stepName) {
                    el.className = 'step active';
                    icon.textContent = '◐';
                } else if (loaderSteps[stepName].progress > loaderSteps[key].progress) {
                    el.className = 'step done';
                    icon.textContent = '●';
                } else {
                    el.className = 'step';
                    icon.textContent = '○';
                }
            });

            if (loadStartTime && step.progress < 100) {
                const elapsed = (Date.now() - loadStartTime) / 1000;
                const estimatedTotal = elapsed / (step.progress / 100);
                const remaining = Math.max(0, Math.round(estimatedTotal - elapsed));
                document.getElementById('eta').textContent = `约 ${remaining} 秒`;
            }
        }

        function hideLoader() {
            updateLoaderStep('done');
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 500);
        }

        async function fetchWithTimestamp(url, timeout = 60000) {
            const separator = url.includes('?') ? '&' : '?';
            const timestampUrl = `${url}${separator}_t=${Date.now()}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const res = await fetch(timestampUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                clearTimeout(timeoutId);
                throw e;
            }
        }

        function updateIndex(prefix, data) {
            if (!data) return;
            const price = data.price;
            const change = data.change_pct;
            const priceEl = document.getElementById(`${prefix}-price`);
            const changeEl = document.getElementById(`${prefix}-change`);

            if (priceEl) priceEl.textContent = price ? price.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '--';
            if (changeEl) {
                if (change > 0) {
                    changeEl.textContent = `+${change.toFixed(2)}%`;
                    changeEl.className = 'change up';
                } else if (change < 0) {
                    changeEl.textContent = `${change.toFixed(2)}%`;
                    changeEl.className = 'change down';
                } else {
                    changeEl.textContent = '0.00%';
                    changeEl.className = 'change flat';
                }
            }
        }

        function updateUIIndices(indices) {
            updateIndex('sh', indices.shanghai);
            updateIndex('sz', indices.shenzhen);
            updateIndex('cy', indices.chinext);
            updateIndex('star', indices.star_50);
            updateIndex('star-com', indices.star_composite);
            updateIndex('csi', indices.csi_all);
        }

        function updateUIBreadth(breadth) {
            document.getElementById('breadth-up').textContent = breadth.up_count || '--';
            document.getElementById('breadth-down').textContent = breadth.down_count || '--';
            document.getElementById('breadth-ratio').textContent = breadth.ratio ? `${breadth.ratio}%` : '--';
            updateBadge('breadth-label', breadth.signal, breadth.label);
        }

        function updateUISectors(sectorsData) {
            const cloud = document.getElementById('sector-cloud');

            if (!sectorsData || !sectorsData.sectors || sectorsData.sectors.length === 0) {
                cloud.innerHTML = '<div style="color:#666;font-size:12px;">暂无数据</div>';
                return;
            }

            const sectors = sectorsData.sectors;

            const maxAmount = Math.max(...sectors.map(s => s.amount || 1));
            const minAmount = Math.min(...sectors.map(s => s.amount || 0));
            const range = maxAmount - minAmount || 1;

            cloud.innerHTML = sectors.map(sector => {
                const amount = sector.amount || 0;
                const normalizedSize = 0.5 + ((amount - minAmount) / range) * 1.5;
                const changePct = sector.change_pct || 0;
                const colorClass = changePct > 0 ? 'up' : (changePct < 0 ? 'down' : 'flat');
                const sign = changePct > 0 ? '+' : '';

                return `
                    <div class="sector-tag ${colorClass}"
                         style="font-size: ${normalizedSize}em;"
                         onclick="showSectorDetail('${sector.sector_name}')">
                        <div class="tag-name">${sector.sector_name}</div>
                        <div class="tag-pct">${sign}${changePct.toFixed(2)}%</div>
                        <div class="tag-tooltip">
                            ${sector.sector_name}<br>
                            涨跌幅: ${sign}${changePct.toFixed(2)}%<br>
                            成交额: ${(amount / 100000000).toFixed(2)}亿
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showSectorDetail(name) {
            console.log('Selected sector:', name);
        }

        function updateSentiment(breadth) {
            const upCount = breadth.up_count || 0;
            const total = breadth.total || 1;
            const index = Math.round(upCount / total * 100 * 100) / 100;
            let label = '无法判断';
            let signal = 'NEUTRAL';
            if (index >= 70) { label = '极度乐观'; signal = 'EXTREME_BULL'; }
            else if (index >= 60) { label = '乐观'; signal = 'BULL'; }
            else if (index >= 45) { label = '中性偏多'; signal = 'SLIGHT_BULL'; }
            else if (index >= 40) { label = '中性偏空'; signal = 'SLIGHT_BEAR'; }
            else if (index >= 30) { label = '悲观'; signal = 'BEAR'; }
            else { label = '极度悲观'; signal = 'EXTREME_BEAR'; }

            document.getElementById('sentiment-label').textContent = label;
            const needle = document.getElementById('sentiment-needle');
            needle.style.left = `${index}%`;
            updateBadge('sentiment-label', signal, label);
        }

        function updateMarketIntensity(breadth, sectorHeat) {
            const breadthSignal = breadth.signal || 'NEUTRAL';
            const sectorSignal = sectorHeat.signal || 'NEUTRAL';
            let overall = '观望';
            let signal = 'NEUTRAL';

            if (breadthSignal === 'EXTREME_BULL' && sectorSignal === 'EXTREME_BULL') {
                overall = '极强做多';
                signal = 'STRONG_BULL';
            } else if (breadthSignal === sectorSignal && (breadthSignal === 'BULL' || breadthSignal === 'EXTREME_BULL')) {
                overall = '做多';
                signal = 'BULL';
            } else if (breadthSignal === sectorSignal && (breadthSignal === 'BEAR' || breadthSignal === 'EXTREME_BEAR')) {
                overall = '做空';
                signal = 'BEAR';
            } else if (breadthSignal === 'NEUTRAL' || sectorSignal === 'NEUTRAL') {
                overall = '观望';
                signal = 'NEUTRAL';
            } else {
                overall = '分歧';
                signal = 'DIVERGENCE';
            }

            updateBadge('intensity-overall', signal, overall);
            updateBadge('intensity-breadth', breadthSignal, breadth.label || '--');
            updateBadge('intensity-sector', sectorSignal, sectorHeat.label || '--');
        }

        function updateBadge(id, signal, label) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = label;
            el.className = `intensity-badge ${getSignalClass(signal)}`;
        }

        function getSignalClass(signal) {
            const map = {
                'EXTREME_BULL': 'extreme_bull',
                'EXTREME_BEAR': 'extreme_bear',
                'BULL': 'bull',
                'BEAR': 'bear',
                'SLIGHT_BULL': 'bull',
                'SLIGHT_BEAR': 'bear',
                'STRONG_BULL': 'extreme_bull',
                'NEUTRAL': 'neutral',
                'DIVERGENCE': 'neutral'
            };
            return map[signal] || 'neutral';
        }

        async function fetchData() {
            loadStartTime = Date.now();
            updateLoaderStep('init');

            try {
                updateLoaderStep('indices');
                const indicesData = await fetchWithTimestamp('/api/indices/fast', 15000);
                updateUIIndices(indicesData);
                updateLoaderStep('indices');

                updateLoaderStep('sectors');
                const sectorsData = await fetchWithTimestamp('/api/sectors/async', 30000);
                updateUISectors(sectorsData);
                updateLoaderStep('sectors');

                updateLoaderStep('breadth');
                const breadthData = await fetchWithTimestamp('/api/breadth/async', 120000);
                updateUIBreadth(breadthData);
                updateSentiment(breadthData);
                updateLoaderStep('breadth');

                updateMarketIntensity(breadthData, sectorsData.heat || {});

                document.getElementById('update-time').textContent = new Date().toLocaleTimeString();

                hideLoader();
            } catch (e) {
                console.error('Fetch error:', e);
                document.getElementById('eta').textContent = '加载失败，请刷新重试';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
